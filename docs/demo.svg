<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 778" width="1200" height="778" role="img" aria-label="mesh-map">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0b1117"/><stop offset="1" stop-color="#070a0e"/>
</linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.4" cy="1.4" r="1.1" fill="#141d27"/>
</pattern>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
  text { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace; }
  .brand { font-size: 23px; font-weight: 700; fill: #e6edf3; letter-spacing: .4px; }
  .sub { font-size: 12.5px; fill: #8090a0; }
  .foot { font-size: 11px; fill: #8090a0; }
  .nh { font-size: 13.5px; font-weight: 600; fill: #e6edf3; }
  .ns { font-size: 11px; fill: #8090a0; }
  .badge { font-size: 9px; fill: #cfd8e3; letter-spacing: .6px; }
  .nbox { fill: #111a23; stroke: #213040; stroke-width: 1; }
  .node.off .nbox { fill: #0e141a; stroke: #2a3542; }
  .node.off .nh, .node.off .ns { fill: #61707e; }
  .node.on .nbox { stroke: #2b4256; }
  .node { cursor: pointer; }
  .node:hover .nbox { stroke: #4d7fa8; }
  .edge { fill: none; stroke-linecap: round; }
  .edge.direct { stroke: #3ddc97; }
  .edge.relay { stroke: #f5a524; stroke-dasharray: 7 7; animation: dash 1.8s linear infinite; }
  .edge.unknown { stroke: #5c6b7a; stroke-dasharray: 2 6; }
  .edge.dead { opacity: .3; }
  .edge-label { font-size: 10.5px; fill: #8090a0; }
  .elabel-bg { fill: #070a0e; opacity: .88; }
  @keyframes dash { to { stroke-dashoffset: -28; } }
  @media (prefers-reduced-motion: reduce) {
    .edge.relay { animation: none; }
  }
</style>
</defs>
